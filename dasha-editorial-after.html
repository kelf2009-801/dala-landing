<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DASHA — Editorial</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--gold:#8a6b1e;--bg:#fff;--text:#1a1a1a;--text2:#5c5c5c;--font-h:'Playfair Display',serif;--font-b:'Inter',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-b);font-weight:300;background:var(--bg);color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;padding:2rem 3rem;border-bottom:1px solid #eee}
header h1{font-family:var(--font-h);font-weight:700;font-size:1.8rem;letter-spacing:3px;color:var(--text)}
header nav{display:flex;gap:2rem}
header nav a{font-size:.75rem;letter-spacing:2px;text-transform:uppercase;color:var(--text2);text-decoration:none;transition:color .3s}
header nav a:hover{color:var(--gold)}
@media(max-width:768px){header{flex-direction:column;gap:1rem;padding:1.5rem}}

/* Hero */
.hero{display:grid;grid-template-columns:1fr 1fr;min-height:90vh}
.hero-img{overflow:hidden}
.hero-img img{width:100%;height:100%;object-fit:cover;object-position:top center}
.hero-text{display:flex;flex-direction:column;justify-content:center;padding:3rem}
.hero-text .num{font-family:var(--font-h);font-size:5rem;color:var(--gold);opacity:.3;line-height:1}
.hero-text h2{font-family:var(--font-h);font-weight:600;font-size:clamp(32px,5vw,52px);line-height:1.1;margin:1rem 0}
.hero-text p{font-size:1rem;color:var(--text2);line-height:1.8;max-width:400px}
.hero-text .line{width:40px;height:2px;background:var(--gold);margin:1.5rem 0}
@media(max-width:768px){.hero{grid-template-columns:1fr}.hero-img{height:50vh}.hero-text{padding:2rem}}

/* Gallery */
.gallery{padding:3rem 1rem;max-width:1200px;margin:0 auto}
.gallery h3{font-family:var(--font-h);font-weight:500;font-size:2rem;text-align:center;margin-bottom:2rem;letter-spacing:2px}
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gallery-grid a{display:block;aspect-ratio:4/5;overflow:hidden;cursor:pointer}
.gallery-grid a img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.gallery-grid a:hover img{transform:scale(1.04)}
.gallery-grid a:nth-child(2){margin-top:30px}
.gallery-grid a:nth-child(5){margin-top:-30px}
@media(max-width:768px){.gallery-grid{grid-template-columns:repeat(2,1fr);gap:8px}.gallery-grid a:nth-child(2),.gallery-grid a:nth-child(5){margin-top:0}}

/* About */
.about{max-width:650px;margin:0 auto;padding:4rem 2rem;text-align:center}
.about .s-label{font-size:.7rem;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:1rem}
.about h2{font-family:var(--font-h);font-weight:600;font-size:clamp(26px,4vw,34px);margin-bottom:1.5rem}
.about p{font-size:1rem;color:var(--text2);line-height:1.9}

/* Social */
.social{display:flex;gap:1.5rem;justify-content:center;padding:2rem}
.social a{width:48px;height:48px;border-radius:50%;border:1px solid #ddd;display:flex;align-items:center;justify-content:center;color:var(--text2);text-decoration:none;transition:all .3s}
.social a:hover{color:var(--gold);border-color:var(--gold)}

/* Particles background */
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.particles span{position:absolute;display:block;width:3px;height:3px;border-radius:50%;background:var(--gold);opacity:0;animation:float-up 15s linear infinite}
.particles span:nth-child(1){left:5%;animation-delay:0s;animation-duration:18s}
.particles span:nth-child(2){left:15%;animation-delay:2s;animation-duration:22s;width:2px;height:2px}
.particles span:nth-child(3){left:28%;animation-delay:5s;animation-duration:16s}
.particles span:nth-child(4){left:40%;animation-delay:8s;animation-duration:20s;width:4px;height:4px}
.particles span:nth-child(5){left:52%;animation-delay:1s;animation-duration:24s}
.particles span:nth-child(6){left:63%;animation-delay:4s;animation-duration:17s;width:2px;height:2px}
.particles span:nth-child(7){left:75%;animation-delay:7s;animation-duration:19s}
.particles span:nth-child(8){left:85%;animation-delay:10s;animation-duration:21s;width:4px;height:4px}
.particles span:nth-child(9){left:92%;animation-delay:3s;animation-duration:23s;width:2px;height:2px}
.particles span:nth-child(10){left:33%;animation-delay:6s;animation-duration:18s}
@keyframes float-up{0%{bottom:-10px;opacity:0;transform:translateY(0)}10%{opacity:0.6}90%{opacity:0.3}100%{bottom:110%;opacity:0;transform:translateY(-20px)}}
@media(max-width:768px){.particles span:nth-child(n+7){display:none}}

/* Text reveal — fade in on scroll */
.reveal{opacity:0;transform:translateY(30px);transition:opacity 0.8s ease,transform 0.8s ease}
.reveal.in{opacity:1;transform:translateY(0)}

/* Header h1 — shimmer gold */
header h1{background:linear-gradient(90deg,var(--text) 0%,var(--gold) 50%,var(--text) 100%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 4s linear infinite}
@keyframes shimmer{0%{background-position:0% center}100%{background-position:200% center}}

/* Nav links — underline grow */
header nav a{position:relative;text-decoration:none}
header nav a::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:1px;background:var(--gold);transition:width 0.4s ease}
header nav a:hover::after{width:100%}

/* Hero text — fade slide */
.hero-text h2{opacity:0;transform:translateX(-20px);animation:slide-in 1s ease 0.3s forwards}
.hero-text p{opacity:0;transform:translateX(-20px);animation:slide-in 1s ease 0.6s forwards}
.hero-text .num{opacity:0;animation:fade-in 1s ease 0.1s forwards}
.hero-text .line{width:0;animation:line-grow 0.8s ease 0.9s forwards}
@keyframes slide-in{to{opacity:1;transform:translateX(0)}}
@keyframes fade-in{to{opacity:0.3}}
@keyframes line-grow{to{width:40px}}

/* About section — fade */
.about h2,.about p,.about .s-label{opacity:0;transform:translateY(20px)}
.about .s-label.in,.about h2.in,.about p.in{opacity:1;transform:translateY(0)}

/* Social buttons — pulse on hover */
.social a{position:relative;overflow:hidden}
.social a::before{content:'';position:absolute;inset:0;background:var(--gold);opacity:0;border-radius:50%;transition:opacity 0.3s}
.social a:hover::before{opacity:0.1}
.social a:hover{transform:scale(1.1) translateY(-2px);box-shadow:0 4px 16px rgba(138,107,30,0.25)}

/* Gallery images — smooth zoom + reveal */
.gallery-grid a{opacity:0;transform:translateY(20px);transition:opacity 0.6s ease,transform 0.6s ease}
.gallery-grid a.in{opacity:1;transform:translateY(0)}
.gallery-grid a:nth-child(2).in{transition-delay:0.1s}
.gallery-grid a:nth-child(3).in{transition-delay:0.2s}
.gallery-grid a:nth-child(4).in{transition-delay:0.1s}
.gallery-grid a:nth-child(5).in{transition-delay:0.2s}
.gallery-grid a:nth-child(6).in{transition-delay:0.3s}

footer{text-align:center;padding:2rem;border-top:1px solid #eee;color:var(--text2);font-size:.75rem;letter-spacing:2px}
</style>
</head>

</script>

<script>
// Reveal on scroll
const reveals = document.querySelectorAll('.reveal, .about .s-label, .about h2, .about p');
if (!('IntersectionObserver' in window)) {
  reveals.forEach(el => el.classList.add('in'));
} else {
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: 0.1 });
  reveals.forEach(el => io.observe(el));
}
</script>
